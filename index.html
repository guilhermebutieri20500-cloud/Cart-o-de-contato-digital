<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Contato UX/UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ana" alt="Avatar Ana Silva" class="avatar">
            <h1 class="name">Ana Silva</h1>
            <p class="role">Desenvolvedora Web Full Stack</p>
        </div>
        
        <div class="card-body">
            <div class="info-row">
                <span class="label">EMAIL:</span>
                <span class="value">ana.silva@email.com</span>
            </div>
            <div class="info-row">
                <span class="label">TELEFONE:</span>
                <span class="value">(11) 99999-9999</span>
            </div>
            <div class="info-row">
                <span class="label">LOCALIZAÇÃO:</span>
                <span class="value">São Paulo, SP</span>
            </div>
        </div>

        <div class="card-footer">
            <button class="btn-primary">ENTRE EM CONTATO</button>
            <p class="status">Disponível para novos projetos</p>
        </div>
    </div>
</body>
</html>
